<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 142">
  <!-- [EN] Card back: necromancy, black magic and vampires — an angry fanged skull with burning eyes and bloody fangs
       on a blood moon, an inverted pentagram in a necromancer's circle, crossed bones, a red-eyed bat, blood pouring
       from the top, a black cemetery fence in red mist. Same proportions as the card (1 : 1.42).
       [RU] Рубашка карты: некромантия, чёрная магия и вампиры — злой череп с горящими глазами и окровавленными
       клыками на кровавой луне, перевёрнутая пентаграмма в круге некроманта, кости крест-накрест, летучая мышь с
       красными глазами, кровь, льющаяся сверху, чёрная кладбищенская ограда в красном тумане. Пропорции карты
       (1 : 1,42). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="51%" r="72%">
      <stop offset="0" stop-color="#4a0710"/>
      <stop offset="0.35" stop-color="#1c0408"/>
      <stop offset="0.75" stop-color="#0a0204"/>
      <stop offset="1" stop-color="#050102"/>
    </radialGradient>
    <radialGradient id="moon" cx="44%" cy="38%" r="66%">
      <stop offset="0" stop-color="#b3172c"/>
      <stop offset="0.55" stop-color="#6e0b18"/>
      <stop offset="1" stop-color="#2e040b"/>
    </radialGradient>
    <linearGradient id="boneFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d2"/>
      <stop offset="1" stop-color="#b9ad8c"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a0b19" stop-opacity="0"/>
      <stop offset="1" stop-color="#6a0b19" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="lattice" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4L4 0L8 4L4 8Z" fill="none" stroke="#3a0a12" stroke-width="0.5"/>
    </pattern>
    <clipPath id="inner"><rect x="7.5" y="7.5" width="85" height="127" rx="4"/></clipPath>
    <path id="bat" d="M0 -2.6L0.9 -4L1.4 -2.2C3 -3.4 6 -4.2 10 -2.4C8.4 -1.6 7.8 -0.4 8 1C6.6 0 5.2 0.2 4.6 1.6C3.6 0.8 2.4 1 1.8 2.4C1.2 1.8 0.6 2.4 0 3.4C-0.6 2.4 -1.2 1.8 -1.8 2.4C-2.4 1 -3.6 0.8 -4.6 1.6C-5.2 0.2 -6.6 0 -8 1C-7.8 -0.4 -8.4 -1.6 -10 -2.4C-6 -4.2 -3 -3.4 -1.4 -2.2L-0.9 -4Z"/>
    <g id="bone">
      <rect x="-24" y="-2" width="48" height="4" rx="2"/>
      <circle cx="-25" cy="-2.3" r="2.8"/><circle cx="-25" cy="2.3" r="2.8"/>
      <circle cx="25" cy="-2.3" r="2.8"/><circle cx="25" cy="2.3" r="2.8"/>
    </g>
  </defs>

  <rect width="100" height="142" fill="url(#bg)"/>
  <rect x="7.5" y="7.5" width="85" height="127" rx="4" fill="url(#lattice)" opacity="0.5"/>

  <g clip-path="url(#inner)">
    <!-- red mist and a black cemetery fence / красный туман и чёрная кладбищенская ограда -->
    <rect x="7.5" y="102" width="85" height="32.5" fill="url(#mist)"/>
    <g fill="#050102" stroke="#050102">
      <path d="M8 125H92M8 131H92" fill="none" stroke-width="1"/>
      <path d="M14 134.5V121M22 134.5V121M30 134.5V121M38 134.5V121M46 134.5V121M54 134.5V121M62 134.5V121M70 134.5V121M78 134.5V121M86 134.5V121" fill="none" stroke-width="1.1"/>
      <path d="M12.4 121.4L14 117.6L15.6 121.4ZM20.4 121.4L22 117.6L23.6 121.4ZM28.4 121.4L30 117.6L31.6 121.4ZM36.4 121.4L38 117.6L39.6 121.4ZM44.4 121.4L46 117.6L47.6 121.4ZM52.4 121.4L54 117.6L55.6 121.4ZM60.4 121.4L62 117.6L63.6 121.4ZM68.4 121.4L70 117.6L71.6 121.4ZM76.4 121.4L78 117.6L79.6 121.4ZM84.4 121.4L86 117.6L87.6 121.4Z" stroke="none"/>
    </g>
    <g fill="#b0101f">
      <circle cx="30" cy="122.4" r="0.6"/><circle cx="54" cy="122.6" r="0.6"/><circle cx="78" cy="122.4" r="0.6"/>
    </g>
    <!-- blood pouring from the top / кровь льётся сверху -->
    <g fill="#7d0817">
      <path d="M7.5 7.5H92.5V11.2C88 12 84 10.6 80 11.6C76 12.4 72 10.8 68 11.8C64 12.6 60 10.6 56 11.5C52 12.3 48 10.9 44 11.7C40 12.4 36 10.7 32 11.6C28 12.4 24 10.8 20 11.6C16 12.3 12 10.9 7.5 11.5Z"/>
      <path d="M14.9 10V14C13.6 15.1 13.6 17.6 16 17.6C18.4 17.6 18.4 15.1 17.1 14V10Z"/>
      <path d="M22.9 10V21C21.6 22.1 21.6 24.6 24 24.6C26.4 24.6 26.4 22.1 25.1 21V10Z"/>
      <path d="M31.9 10V26C30.6 27.1 30.6 29.6 33 29.6C35.4 29.6 35.4 27.1 34.1 26V10Z"/>
      <path d="M39.9 10V16C38.6 17.1 38.6 19.6 41 19.6C43.4 19.6 43.4 17.1 42.1 16V10Z"/>
      <path d="M48.9 10V29C47.6 30.1 47.6 32.6 50 32.6C52.4 32.6 52.4 30.1 51.1 29V10Z"/>
      <path d="M56.9 10V18C55.6 19.1 55.6 21.6 58 21.6C60.4 21.6 60.4 19.1 59.1 18V10Z"/>
      <path d="M65.9 10V24C64.6 25.1 64.6 27.6 67 27.6C69.4 27.6 69.4 25.1 68.1 24V10Z"/>
      <path d="M74.9 10V13C73.6 14.1 73.6 16.6 76 16.6C78.4 16.6 78.4 14.1 77.1 13V10Z"/>
      <path d="M82.9 10V20C81.6 21.1 81.6 23.6 84 23.6C86.4 23.6 86.4 21.1 85.1 20V10Z"/>
    </g>
    <g fill="#d8475a" opacity="0.55">
      <circle cx="32.3" cy="28.2" r="0.5"/><circle cx="49.3" cy="31.2" r="0.5"/><circle cx="66.3" cy="26.2" r="0.5"/><circle cx="23.3" cy="23.2" r="0.5"/>
    </g>
  </g>

  <!-- frame / рамка -->
  <rect x="4" y="4" width="92" height="134" rx="6" fill="none" stroke="#8a6d43" stroke-width="1.4"/>
  <rect x="7.5" y="7.5" width="85" height="127" rx="4" fill="none" stroke="#6e1420" stroke-width="0.7"/>

  <!-- necromancer's circle / круг некроманта -->
  <g fill="none">
    <circle cx="50" cy="70" r="34" stroke="#8a6d43" stroke-width="0.6" opacity="0.7"/>
    <circle cx="50" cy="70" r="32.5" stroke="#8a6d43" stroke-width="2.4" stroke-dasharray="0.5 8.008" opacity="0.55"/>
    <circle cx="50" cy="70" r="31" stroke="#6e1420" stroke-width="0.5"/>
  </g>

  <!-- blood moon / кровавая луна -->
  <circle cx="50" cy="70" r="30.5" fill="#8a0f20" opacity="0.22"/>
  <circle cx="50" cy="70" r="27" fill="url(#moon)"/>
  <circle cx="40.5" cy="57" r="2.6" fill="#3a050c" opacity="0.5"/>
  <circle cx="60" cy="61" r="1.8" fill="#3a050c" opacity="0.4"/>

  <!-- inverted pentagram of black magic / перевёрнутая пентаграмма чёрной магии -->
  <path d="M50 101L31.78 44.92L79.48 79.58L20.52 79.58L68.22 44.92Z" fill="none" stroke="#050102" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M50 101L31.78 44.92L79.48 79.58L20.52 79.58L68.22 44.92Z" fill="none" stroke="#e0283a" stroke-width="0.6" stroke-linejoin="miter" opacity="0.9"/>
  <g fill="#ff2a3a">
    <circle cx="50" cy="101" r="0.9"/><circle cx="31.78" cy="44.92" r="0.9"/><circle cx="68.22" cy="44.92" r="0.9"/>
    <circle cx="20.52" cy="79.58" r="0.9"/><circle cx="79.48" cy="79.58" r="0.9"/>
  </g>

  <!-- bats; the big one has red eyes / летучие мыши; у большой красные глаза -->
  <g fill="#050102">
    <use href="#bat" transform="translate(50 46.5) scale(1.05)"/>
    <use href="#bat" transform="translate(34 55.5) scale(0.55)"/>
    <use href="#bat" transform="translate(66.5 53.5) scale(0.5)"/>
  </g>
  <circle cx="49.4" cy="44.9" r="0.38" fill="#ff2a3a"/>
  <circle cx="50.6" cy="44.9" r="0.38" fill="#ff2a3a"/>

  <!-- crossed bones / кости крест-накрест -->
  <g fill="#c9bc9c" stroke="#0a0204" stroke-width="0.7">
    <use href="#bone" transform="translate(50 87) rotate(45)"/>
    <use href="#bone" transform="translate(50 87) rotate(-45)"/>
  </g>

  <!-- the angry skull / злой череп -->
  <path d="M50 61C40 61 33.5 67.5 33.5 76C33.5 81 35.5 84.8 38.6 86.6L39.4 92C39.6 94 41 95 43 95L57 95C59 95 60.4 94 60.6 92L61.4 86.6C64.5 84.8 66.5 81 66.5 76C66.5 67.5 60 61 50 61Z" fill="url(#boneFill)" stroke="#0a0204" stroke-width="0.8"/>
  <path d="M52.5 61.2L54.6 64.6L52.8 67L55.4 70.2L54.2 72M54.6 64.6L57 65.6" fill="none" stroke="#3a2a1e" stroke-width="0.6"/>
  <path d="M36 80C38 84 40 86 41.5 86.6M64 80C62 84 60 86 58.5 86.6" fill="none" stroke="#6b5c44" stroke-width="0.6" opacity="0.7"/>
  <g fill="#0a0204">
    <path d="M37.2 71.2L46.8 75.4C46.6 78.6 44.6 80.8 41.8 80.8C38.8 80.8 36.8 78.4 36.6 75.6C36.5 73.8 36.7 72.3 37.2 71.2Z"/>
    <path d="M62.8 71.2L53.2 75.4C53.4 78.6 55.4 80.8 58.2 80.8C61.2 80.8 63.2 78.4 63.4 75.6C63.5 73.8 63.3 72.3 62.8 71.2Z"/>
    <path d="M50 81L47.6 86L50 85.2L52.4 86Z"/>
  </g>
  <path d="M35.4 69.4L47.6 74.4M64.6 69.4L52.4 74.4" fill="none" stroke="#0a0204" stroke-width="1" stroke-linecap="round"/>
  <!-- burning eyes / горящие глаза -->
  <g fill="#ff1f35">
    <circle cx="42" cy="77.2" r="5" opacity="0.14"/><circle cx="58" cy="77.2" r="5" opacity="0.14"/>
    <circle cx="42" cy="77.2" r="3.2" opacity="0.3"/><circle cx="58" cy="77.2" r="3.2" opacity="0.3"/>
    <circle cx="42" cy="77.2" r="1.6"/><circle cx="58" cy="77.2" r="1.6"/>
  </g>
  <circle cx="42" cy="77.2" r="0.5" fill="#ffd5d9"/>
  <circle cx="58" cy="77.2" r="0.5" fill="#ffd5d9"/>
  <!-- the grin: sharp teeth and long bloody fangs / оскал: острые зубы и длинные окровавленные клыки -->
  <path d="M40.6 88.4C45 89.6 55 89.6 59.4 88.4L58.8 93.6C55 94.8 45 94.8 41.2 93.6Z" fill="#0a0204"/>
  <g fill="#ede5d0" stroke="#0a0204" stroke-width="0.35" stroke-linejoin="round">
    <path d="M41.4 88.7L43.4 89.1L42.3 91.2Z"/>
    <path d="M47.2 89.3L49.2 89.4L48.2 91.4Z"/>
    <path d="M50.8 89.4L52.8 89.3L51.8 91.4Z"/>
    <path d="M56.6 89.1L58.6 88.7L57.7 91.2Z"/>
    <path d="M42.2 93.7L44 94L43.2 91.8Z"/>
    <path d="M49 94.3L51 94.3L50 92Z"/>
    <path d="M56 94L57.8 93.7L56.8 91.8Z"/>
    <path d="M43.8 89L46.8 89.3L45 98.6Z"/>
    <path d="M53.2 89.3L56.2 89L55 98.6Z"/>
  </g>
  <path d="M45.6 92L45.1 97.6M54.4 92L54.9 97.6" fill="none" stroke="#9a0d1c" stroke-width="0.5"/>
  <g fill="#b0101f">
    <path d="M45 99.2C44.2 100.4 43.9 101.2 44.2 101.8C44.5 102.5 45.5 102.5 45.8 101.8C46.1 101.2 45.8 100.4 45 99.2Z"/>
    <path d="M55 99.2C54.2 100.4 53.9 101.2 54.2 101.8C54.5 102.5 55.5 102.5 55.8 101.8C56.1 101.2 55.8 100.4 55 99.2Z"/>
  </g>
</svg>
