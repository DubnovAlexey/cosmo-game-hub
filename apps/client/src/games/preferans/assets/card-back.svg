<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 142">
  <!-- [EN] Card back, 09.11.2026 (DESIGN_CONCEPT_RU.md §3; Alexey: keep it evil, make it finer, deeper and dearer):
       wine-black lacquer with a tone-on-tone gothic damask and a soft sheen; a triple frame of blackened silver with
       a filigree vine; in every corner a crimson rose on a thorned stem with drops of blood on the thorns; silver
       bat-wing crests top and bottom; in the middle a silver medallion — an angry fanged skull with burning eyes on a
       blood moon, an inverted pentagram, crossed bones, bats. Point-symmetric outside the medallion, the card's own
       proportions (1 : 1.42).
       [RU] Рубашка карты, 09.11.2026 (DESIGN_CONCEPT_RU.md §3; Алексей: оставить злой, сделать тоньше, глубже и
       дороже): винно-чёрный лак с готическим дамаском тон-в-тон и мягким бликом; тройная рамка черненого серебра с
       филигранной лозой; в каждом углу багровая роза на стебле с острыми шипами и каплями крови на шипах; серебряные
       гребни-крылья сверху и снизу; в центре серебряный медальон — злой череп с клыками и горящими глазами на
       кровавой луне, перевёрнутая пентаграмма, кости крест-накрест, летучие мыши. Вне медальона — центральная
       симметрия, пропорции карты (1 : 1,42). -->
  <defs>
    <radialGradient id="lacquer" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#3d0610"/>
      <stop offset="0.45" stop-color="#1a0308"/>
      <stop offset="1" stop-color="#060103"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f3"/>
      <stop offset="0.25" stop-color="#8d939c"/>
      <stop offset="0.5" stop-color="#2b2e34"/>
      <stop offset="0.72" stop-color="#b4bac2"/>
      <stop offset="1" stop-color="#3c4048"/>
    </linearGradient>
    <linearGradient id="silverV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset="0.55" stop-color="#7c838d"/>
      <stop offset="1" stop-color="#23262b"/>
    </linearGradient>
    <radialGradient id="moon" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#c41a31"/>
      <stop offset="0.5" stop-color="#6e0b18"/>
      <stop offset="1" stop-color="#25030a"/>
    </radialGradient>
    <radialGradient id="petal" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ff5d6c"/>
      <stop offset="0.45" stop-color="#b3102a"/>
      <stop offset="1" stop-color="#3f030d"/>
    </radialGradient>
    <radialGradient id="blood" cx="38%" cy="62%" r="70%">
      <stop offset="0" stop-color="#ff4a58"/>
      <stop offset="0.5" stop-color="#b30f22"/>
      <stop offset="1" stop-color="#4a020b"/>
    </radialGradient>
    <linearGradient id="boneFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1eadb"/>
      <stop offset="0.6" stop-color="#d0c5a8"/>
      <stop offset="1" stop-color="#9c9072"/>
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#ff3346" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ff1f35" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff1f35" stop-opacity="0"/>
    </radialGradient>
    <!-- a gothic damask tone-on-tone: quatrefoils in a diamond lattice / готический дамаск тон-в-тон -->
    <pattern id="damask" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5L5 0L10 5L5 10Z" fill="none" stroke="#4a0a14" stroke-width="0.35"/>
      <g fill="none" stroke="#56101b" stroke-width="0.3">
        <circle cx="5" cy="3.7" r="1.1"/><circle cx="5" cy="6.3" r="1.1"/><circle cx="3.7" cy="5" r="1.1"/><circle cx="6.3" cy="5" r="1.1"/>
      </g>
      <circle cx="5" cy="5" r="0.45" fill="#5e1220"/>
    </pattern>
    <clipPath id="field"><rect x="7.5" y="7.5" width="85" height="127" rx="3.5"/></clipPath>
    <path id="bat" d="M0 -2.6L0.9 -4L1.4 -2.2C3 -3.4 6 -4.2 10 -2.4C8.4 -1.6 7.8 -0.4 8 1C6.6 0 5.2 0.2 4.6 1.6C3.6 0.8 2.4 1 1.8 2.4C1.2 1.8 0.6 2.4 0 3.4C-0.6 2.4 -1.2 1.8 -1.8 2.4C-2.4 1 -3.6 0.8 -4.6 1.6C-5.2 0.2 -6.6 0 -8 1C-7.8 -0.4 -8.4 -1.6 -10 -2.4C-6 -4.2 -3 -3.4 -1.4 -2.2L-0.9 -4Z"/>
    <g id="bone">
      <rect x="-24" y="-2" width="48" height="4" rx="2"/>
      <circle cx="-25" cy="-2.3" r="2.8"/><circle cx="-25" cy="2.3" r="2.8"/>
      <circle cx="25" cy="-2.3" r="2.8"/><circle cx="25" cy="2.3" r="2.8"/>
    </g>
    <!-- a drop of blood with its glint / капля крови с бликом -->
    <g id="drop">
      <path d="M0 0C-0.85 1.35-1.2 2.2-0.95 2.85C-0.65 3.6 0.65 3.6 0.95 2.85C1.2 2.2 0.85 1.35 0 0Z" fill="url(#blood)"/>
      <ellipse cx="-0.35" cy="2.5" rx="0.22" ry="0.35" fill="#ffd9dd" opacity="0.85"/>
    </g>
    <!-- a corner: a crimson rose on a thorned stem that runs along both edges, leaves, blood on the thorns
         угол: багровая роза на стебле с шипами вдоль обоих краёв, листья, кровь на шипах -->
    <g id="corner">
      <g fill="none" stroke="#10170f" stroke-width="0.95" stroke-linecap="round">
        <path d="M14.5 11.2C20 9.6 25 11.4 30 10.2C33 9.5 36 10.4 38.5 9.9"/>
        <path d="M11.2 14.5C9.6 20 11.4 25 10.2 30C9.5 33 10.4 36 9.9 38.5"/>
      </g>
      <g fill="#1a2418" stroke="#0a0f09" stroke-width="0.2">
        <path d="M19.5 10.4L20.6 8.1L21.3 10.5Z"/><path d="M25.6 10.9L26.4 12.9L24.6 11.4Z"/><path d="M31.4 10L32.2 7.9L32.9 10Z"/><path d="M36.3 10.2L37.2 12.1L35.6 10.6Z"/>
        <path d="M10.4 19.5L8.1 20.6L10.5 21.3Z"/><path d="M10.9 25.6L12.9 26.4L11.4 24.6Z"/><path d="M10 31.4L7.9 32.2L10 32.9Z"/><path d="M10.2 36.3L12.1 37.2L10.6 35.6Z"/>
      </g>
      <g fill="#14261a" stroke="#06100a" stroke-width="0.25">
        <path d="M17 12.6C19.5 13.6 21.6 15.6 22 17.8C19.6 17.3 17.6 15.4 17 12.6Z"/>
        <path d="M12.6 17C13.6 19.5 15.6 21.6 17.8 22C17.3 19.6 15.4 17.6 12.6 17Z"/>
      </g>
      <path d="M17.6 13.4C19.2 14.6 20.6 16.1 21.4 17.4M13.4 17.6C14.6 19.2 16.1 20.6 17.4 21.4" fill="none" stroke="#2c4630" stroke-width="0.25"/>
      <!-- the bloom / цветок -->
      <g transform="translate(13 13)">
        <circle r="5.4" fill="#2a0208" opacity="0.6"/>
        <g fill="url(#petal)" stroke="#2a0208" stroke-width="0.3">
          <ellipse rx="3.2" ry="2.1" transform="rotate(0) translate(0 -2.6)"/>
          <ellipse rx="3.2" ry="2.1" transform="rotate(72) translate(0 -2.6)"/>
          <ellipse rx="3.2" ry="2.1" transform="rotate(144) translate(0 -2.6)"/>
          <ellipse rx="3.2" ry="2.1" transform="rotate(216) translate(0 -2.6)"/>
          <ellipse rx="3.2" ry="2.1" transform="rotate(288) translate(0 -2.6)"/>
          <ellipse rx="2.5" ry="1.6" transform="rotate(36) translate(0 -1.7)"/>
          <ellipse rx="2.5" ry="1.6" transform="rotate(108) translate(0 -1.7)"/>
          <ellipse rx="2.5" ry="1.6" transform="rotate(180) translate(0 -1.7)"/>
          <ellipse rx="2.5" ry="1.6" transform="rotate(252) translate(0 -1.7)"/>
          <ellipse rx="2.5" ry="1.6" transform="rotate(324) translate(0 -1.7)"/>
          <circle r="1.7"/>
        </g>
        <path d="M0.2-1.2C1.2-1 1.4 0.2 0.7 0.8C-0.2 1.4-1.3 0.7-1.1-0.3C-1-0.9-0.4-1.1 0.1-0.9C0.6-0.7 0.6 0 0.2 0.2" fill="none" stroke="#3f030d" stroke-width="0.35" stroke-linecap="round"/>
        <ellipse cx="-1.4" cy="-2.6" rx="0.9" ry="0.4" fill="#ffb3bc" opacity="0.5" transform="rotate(-20)"/>
      </g>
      <use href="#drop" xlink:href="#drop" transform="translate(20.4 10.9)"/>
      <use href="#drop" xlink:href="#drop" transform="translate(32.2 10.4) scale(0.8)"/>
      <use href="#drop" xlink:href="#drop" transform="translate(9.5 21.6) scale(0.9)"/>
      <use href="#drop" xlink:href="#drop" transform="translate(9.6 33.4) scale(0.7)"/>
    </g>
    <!-- a silver filigree vine along a long edge / серебряная филигранная лоза вдоль длинного края -->
    <g id="vine" fill="none" stroke="url(#silverV)" stroke-width="0.45" stroke-linecap="round">
      <path d="M10 44C12.8 49 7.6 54 10 59C12.8 64 7.6 69 10 71"/>
      <path d="M10.8 47.2C12.6 46.8 13.2 48.4 12.2 49.2M9.2 53.6C7.4 53.2 6.9 54.8 7.8 55.6M10.8 62.2C12.6 61.8 13.2 63.4 12.2 64.2M9.2 67.6C7.4 67.2 6.9 68.8 7.8 69.6"/>
    </g>
    <!-- a silver crest of bat wings / серебряный гребень-крылья -->
    <g id="crest">
      <use href="#bat" xlink:href="#bat" transform="scale(1.15)" fill="url(#silverV)" stroke="#15171b" stroke-width="0.25"/>
      <circle cx="-0.6" cy="-1.4" r="0.35" fill="#ff2a3a"/><circle cx="0.6" cy="-1.4" r="0.35" fill="#ff2a3a"/>
    </g>
  </defs>

  <!-- lacquer, damask and sheen / лак, дамаск и блик -->
  <rect width="100" height="142" fill="url(#lacquer)"/>
  <rect x="7.5" y="7.5" width="85" height="127" rx="3.5" fill="url(#damask)" opacity="0.75"/>
  <rect width="100" height="142" fill="url(#sheen)"/>

  <!-- the triple frame of blackened silver / тройная рамка черненого серебра -->
  <rect x="2.4" y="2.4" width="95.2" height="137.2" rx="6" fill="none" stroke="url(#silver)" stroke-width="1.3"/>
  <rect x="4.9" y="4.9" width="90.2" height="132.2" rx="4.6" fill="none" stroke="#15171b" stroke-width="0.6"/>
  <rect x="5.6" y="5.6" width="88.8" height="130.8" rx="4.2" fill="none" stroke="url(#silver)" stroke-width="0.35" stroke-dasharray="0.6 1.4"/>
  <rect x="7.5" y="7.5" width="85" height="127" rx="3.5" fill="none" stroke="url(#silver)" stroke-width="0.55"/>

  <!-- filigree vines, crests, rose corners (point-symmetric) / лозы, гребни, розы по углам (центральная симметрия) -->
  <use href="#vine" xlink:href="#vine"/>
  <use href="#vine" xlink:href="#vine" transform="translate(100 0) scale(-1 1)"/>
  <use href="#vine" xlink:href="#vine" transform="translate(0 142) scale(1 -1)"/>
  <use href="#vine" xlink:href="#vine" transform="translate(100 142) scale(-1 -1)"/>
  <use href="#crest" xlink:href="#crest" transform="translate(50 11.4)"/>
  <use href="#crest" xlink:href="#crest" transform="translate(50 130.6) rotate(180)"/>
  <g clip-path="url(#field)">
    <use href="#corner" xlink:href="#corner"/>
    <use href="#corner" xlink:href="#corner" transform="translate(100 0) scale(-1 1)"/>
    <use href="#corner" xlink:href="#corner" transform="translate(0 142) scale(1 -1)"/>
    <use href="#corner" xlink:href="#corner" transform="translate(100 142) scale(-1 -1)"/>
  </g>

  <!-- the silver medallion / серебряный медальон -->
  <circle cx="50" cy="71" r="33.2" fill="#000000" opacity="0.35"/>
  <circle cx="50" cy="71" r="32.4" fill="none" stroke="url(#silver)" stroke-width="1.4"/>
  <circle cx="50" cy="71" r="30.8" fill="none" stroke="#15171b" stroke-width="1"/>
  <circle cx="50" cy="71" r="30.1" fill="none" stroke="url(#silverV)" stroke-width="0.9" stroke-dasharray="0.35 1.9"/>
  <g fill="url(#silverV)" stroke="#15171b" stroke-width="0.25">
    <path d="M50 37L51.6 38.6L50 40.2L48.4 38.6Z"/><path d="M50 101.8L51.6 103.4L50 105L48.4 103.4Z"/>
    <path d="M16.2 71L17.8 69.4L19.4 71L17.8 72.6Z"/><path d="M80.6 71L82.2 69.4L83.8 71L82.2 72.6Z"/>
  </g>

  <!-- the blood moon / кровавая луна -->
  <circle cx="50" cy="71" r="29.2" fill="url(#moon)"/>
  <circle cx="50" cy="71" r="29.2" fill="none" stroke="#ff4a5a" stroke-width="0.3" opacity="0.35"/>
  <circle cx="40.5" cy="58" r="2.6" fill="#2a0309" opacity="0.45"/>
  <circle cx="60.5" cy="61.5" r="1.7" fill="#2a0309" opacity="0.4"/>
  <circle cx="63.5" cy="83" r="1.2" fill="#2a0309" opacity="0.35"/>

  <!-- the inverted pentagram, thin and glowing / перевёрнутая пентаграмма, тонкая и светящаяся -->
  <path d="M50 100L32.6 46.4L78.2 79.5L21.8 79.5L67.4 46.4Z" fill="none" stroke="#1a0206" stroke-width="1.3" stroke-linejoin="miter"/>
  <path d="M50 100L32.6 46.4L78.2 79.5L21.8 79.5L67.4 46.4Z" fill="none" stroke="#ff2a3a" stroke-width="0.4" stroke-linejoin="miter" opacity="0.85"/>
  <g fill="#ff6a78">
    <circle cx="50" cy="100" r="0.7"/><circle cx="32.6" cy="46.4" r="0.7"/><circle cx="67.4" cy="46.4" r="0.7"/>
    <circle cx="21.8" cy="79.5" r="0.7"/><circle cx="78.2" cy="79.5" r="0.7"/>
  </g>

  <!-- bats under the moon, the big one with red eyes / летучие мыши под луной, у большой красные глаза -->
  <g fill="#070103" stroke="#5a0a14" stroke-width="0.2">
    <use href="#bat" xlink:href="#bat" transform="translate(50 49) scale(1.05)"/>
    <use href="#bat" xlink:href="#bat" transform="translate(34 57) scale(0.55)"/>
    <use href="#bat" xlink:href="#bat" transform="translate(66.5 55.5) scale(0.5)"/>
  </g>
  <circle cx="49.4" cy="47.4" r="0.38" fill="#ff2a3a"/>
  <circle cx="50.6" cy="47.4" r="0.38" fill="#ff2a3a"/>

  <!-- crossed bones / кости крест-накрест -->
  <g fill="url(#boneFill)" stroke="#0a0204" stroke-width="0.6">
    <use href="#bone" xlink:href="#bone" transform="translate(50 92) rotate(45) scale(0.82)"/>
    <use href="#bone" xlink:href="#bone" transform="translate(50 92) rotate(-45) scale(0.82)"/>
  </g>

  <!-- the angry skull / злой череп -->
  <ellipse cx="50" cy="95.5" rx="12" ry="2" fill="#000000" opacity="0.35"/>
  <path d="M50 62C40 62 33.5 68.5 33.5 77C33.5 82 35.5 85.8 38.6 87.6L39.4 93C39.6 95 41 96 43 96L57 96C59 96 60.4 95 60.6 93L61.4 87.6C64.5 85.8 66.5 82 66.5 77C66.5 68.5 60 62 50 62Z" fill="url(#boneFill)" stroke="#0a0204" stroke-width="0.45"/>
  <path d="M37.5 84.5C40 88.5 44 89.4 50 89.4C56 89.4 60 88.5 62.5 84.5C60 86.2 56 87 50 87C44 87 40 86.2 37.5 84.5Z" fill="#6b5c44" opacity="0.35"/>
  <path d="M50 62C44 62 39.5 64.5 37 68.5C41 66 45.5 65.2 50 65.2C54.5 65.2 59 66 63 68.5C60.5 64.5 56 62 50 62Z" fill="#ffffff" opacity="0.22"/>
  <path d="M52.5 62.2L54.6 65.6L52.8 68L55.4 71.2L54.2 73M54.6 65.6L57 66.6" fill="none" stroke="#3a2a1e" stroke-width="0.5"/>
  <path d="M36 81C38 85 40 87 41.5 87.6M64 81C62 85 60 87 58.5 87.6" fill="none" stroke="#6b5c44" stroke-width="0.5" opacity="0.7"/>
  <g fill="#0a0204">
    <path d="M37.2 72.2L46.8 76.4C46.6 79.6 44.6 81.8 41.8 81.8C38.8 81.8 36.8 79.4 36.6 76.6C36.5 74.8 36.7 73.3 37.2 72.2Z"/>
    <path d="M62.8 72.2L53.2 76.4C53.4 79.6 55.4 81.8 58.2 81.8C61.2 81.8 63.2 79.4 63.4 76.6C63.5 74.8 63.3 73.3 62.8 72.2Z"/>
    <path d="M50 82L47.6 87L50 86.2L52.4 87Z"/>
  </g>
  <path d="M35.4 70.4L47.6 75.4M64.6 70.4L52.4 75.4" fill="none" stroke="#0a0204" stroke-width="1" stroke-linecap="round"/>
  <!-- burning eyes / горящие глаза -->
  <circle cx="42" cy="78.2" r="5.5" fill="url(#eyeGlow)"/>
  <circle cx="58" cy="78.2" r="5.5" fill="url(#eyeGlow)"/>
  <g fill="#ff1f35"><circle cx="42" cy="78.2" r="1.6"/><circle cx="58" cy="78.2" r="1.6"/></g>
  <circle cx="42" cy="78.2" r="0.5" fill="#ffe0e3"/>
  <circle cx="58" cy="78.2" r="0.5" fill="#ffe0e3"/>
  <!-- the grin: sharp teeth and long bloody fangs / оскал: острые зубы и длинные окровавленные клыки -->
  <path d="M40.6 89.4C45 90.6 55 90.6 59.4 89.4L58.8 94.6C55 95.8 45 95.8 41.2 94.6Z" fill="#0a0204"/>
  <g fill="#efe7d3" stroke="#0a0204" stroke-width="0.3" stroke-linejoin="round">
    <path d="M41.4 89.7L43.4 90.1L42.3 92.2Z"/>
    <path d="M47.2 90.3L49.2 90.4L48.2 92.4Z"/>
    <path d="M50.8 90.4L52.8 90.3L51.8 92.4Z"/>
    <path d="M56.6 90.1L58.6 89.7L57.7 92.2Z"/>
    <path d="M42.2 94.7L44 95L43.2 92.8Z"/>
    <path d="M49 95.3L51 95.3L50 93Z"/>
    <path d="M56 95L57.8 94.7L56.8 92.8Z"/>
    <path d="M43.8 90L46.8 90.3L45 99.6Z"/>
    <path d="M53.2 90.3L56.2 90L55 99.6Z"/>
  </g>
  <path d="M45.6 93L45.1 98.6M54.4 93L54.9 98.6" fill="none" stroke="#9a0d1c" stroke-width="0.45"/>
  <use href="#drop" xlink:href="#drop" transform="translate(45 99.6) scale(0.9)"/>
  <use href="#drop" xlink:href="#drop" transform="translate(55 99.6) scale(0.9)"/>
</svg>
